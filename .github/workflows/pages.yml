name: Deploy website to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build project website
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/build.mjs "${BASE_PATH:-/}"
      - name: Validate pages and public assets
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node --experimental-vm-modules scripts/validate.mjs "${BASE_PATH:-/}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
